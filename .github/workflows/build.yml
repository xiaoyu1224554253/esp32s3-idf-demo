name: Build ESP32-S3 IDF v6.0.2
# Test workflow-scope push permission

on:
  push:
    branches: [ main, feat/music-player ]
  pull_request:
    branches: [ main ]

jobs:
  build_firmware:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 编译工程
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: "v6.0.2"
          target: "esp32s3"

      - name: 合并完整固件
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          esptool.py --chip esp32s3 merge_bin -o build/firmware-all.bin \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/*.bin

      - name: 上传完整固件产物
        uses: actions/upload-artifact@v4
        with:
          name: ESP32S3-firmware-bin
          path: |
            build/firmware-all.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/*.bin
